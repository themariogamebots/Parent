spring.profiles.active=@spring.profiles.active@

server.port=${SERVER_PORT}

spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USERNAME}
spring.datasource.password=${JDBC_PASSWORD}
spring.datasource.driverClassName=${JDBC_DRIVER}

# El esquema lo gobierna Flyway; Hibernate solo comprueba que el modelo cuadra con él.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration/${FLYWAY_ENGINE}

# Idioma por defecto cuando el de Telegram no está entre los soportados
app.default-language=es

# Reglas de partida.
# El mínimo es 5 y el máximo 10 porque la tabla de reparto de roles de SHUtils solo cubre ese rango:
# con menos jugadores la partida arrancaría y reventaría al repartir los roles.
sh.game.default-min-number-of-players=5
sh.game.default-max-number-of-players=10
sh.game.initial-number-of-fascist-laws-in-deck=11
sh.game.initial-number-of-liberal-laws-in-deck=6
sh.game.max-cards-remaining-before-shuffling=3
sh.game.number-of-cards-picked-by-president=3
sh.game.liberal-laws-to-win=5
sh.game.fascist-laws-to-win=6

# Ids de Telegram con permisos de administración, separados por comas
telegram.bots.admin-ids=${TELEGRAM_ADMIN_IDS:}

# Modo del bot: longpolling | webhook
telegram.bots.type=${BOT_TYPE:longpolling}

# Los starters de telegrambots registran los dos un bean 'telegramBotsApplication' y chocan entre sí
# (Boot 4 no permite override de beans). Los sustituye TelegramBotsRegistrarConfig, que además añade
# el endpoint HTTP que el starter de webhook no trae.
spring.autoconfigure.exclude=\
  org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration,\
  org.telegram.telegrambots.webhook.starter.TelegramBotStarterConfiguration

# Datos de presentación del bot
sh.telegram.game.display-name=Secret Hitler
sh.telegram.game.alias=@shbot
sh.telegram.game.version=2.0.0
sh.telegram.game.owner-alias=@themarioga
sh.telegram.game.help-url=https://www.secrethitler.com/assets/Secret_Hitler_Rules.pdf

sh.bot.enabled=${SH_BOT_ENABLED}
sh.bot.token=${SH_BOT_TOKEN}
sh.bot.name=${SH_BOT_NAME}
# Debe apuntar a <host>/callback/${SH_BOT_NAME}
sh.bot.webhook.url=${SH_BOT_WEBHOOK_URL:}
sh.bot.webhook.cert.path=${SH_BOT_WEBHOOK_CERT_PATH:}
