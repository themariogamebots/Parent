# Producción.
#
# Telegram exige HTTPS para los webhooks, así que el certificado no es opcional en ese modo. Con
# telegram.bots.type=longpolling no hace falta: el bot es quien llama a Telegram, no al revés.
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_KEYSTORE_FILE}
server.ssl.key-store-password=${SERVER_KEYSTORE_PASSWORD}
server.ssl.key-alias=${SERVER_KEYSTORE_ALIAS}
server.ssl.key-store-type=PKCS12

# Renovación automática del certificado. El reto HTTP-01 se sirve en
# /.well-known/acme-challenge/**, que SecurityConfig deja abierto.
lets-encrypt-helper.enabled=${LETS_ENCRYPT_ENABLED:false}
lets-encrypt-helper.domain=${LETS_ENCRYPT_DOMAIN:}
lets-encrypt-helper.contact=mailto:${LETS_ENCRYPT_EMAIL:}

# El esquema no se toca solo en producción: lo aplica Flyway y Hibernate solo comprueba que cuadra
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

logging.level.org.themarioga=info
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.SQL_SLOW=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
logging.level.org.springframework=warn
logging.level.root=warn
