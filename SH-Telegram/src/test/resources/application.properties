# Los starters de long-polling y de webhook registran los dos un bean 'telegramBotsApplication' y
# chocan entre sí (Boot 4 no permite override de beans). Aquí no hace falta ninguno salvo en los
# tests que encienden el bot, que lo piden por propiedades.
spring.autoconfigure.exclude=\
  org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration,\
  org.telegram.telegrambots.webhook.starter.TelegramBotStarterConfiguration

spring.datasource.url=jdbc:h2:mem:shtelegram;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lo que se está probando: que el baseline de Flyway y el modelo de entidades cuadran.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.default-language=es

sh.game.default-min-number-of-players=5
sh.game.default-max-number-of-players=10
sh.game.initial-number-of-fascist-laws-in-deck=11
sh.game.initial-number-of-liberal-laws-in-deck=6
sh.game.max-cards-remaining-before-shuffling=3
sh.game.number-of-cards-picked-by-president=3
sh.game.liberal-laws-to-win=5
sh.game.fascist-laws-to-win=6

sh.telegram.game.display-name=Secret Hitler
sh.telegram.game.alias=@shtestbot
sh.telegram.game.version=2.0.0
sh.telegram.game.owner-alias=@themarioga
sh.telegram.game.help-url=https://example.invalid/ayuda
